<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Angry Hamster Survival Guide</title>

<style>
* {
    box-sizing: border-box;
}

html {
    background: #030303;
    overscroll-behavior: none;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;

    background:
        radial-gradient(circle at top, #161616 0%, #090909 45%, #030303 100%);

    color: #eeeeee;
    font-family: "Courier New", monospace;
    text-align: center;
    padding: 24px;

    overscroll-behavior: none;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top, #161616 0%, #090909 45%, #030303 100%);
    color: #eeeeee;
    font-family: "Courier New", monospace;
    text-align: center;
    padding: 24px;
}

/* kevyt retro-scanline */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999999;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.012) 0px,
        rgba(255,255,255,0.012) 1px,
        transparent 2px,
        transparent 4px
    );
}

.container {
    max-width: 760px;
    margin: auto;
    background: rgba(8, 8, 8, 0.96);
    border: 1px solid #5d2727;
    padding: 32px;
    box-shadow: 0 0 35px rgba(255, 70, 70, 0.05);
}

/* VANHA OTSIKKOTYYLI */

h1 {
    color: #ffb6d9;
    text-shadow: 0 0 12px rgba(255, 182, 217, 0.35);
    font-size: clamp(26px, 5vw, 42px);
    margin: 5px 0 14px;
    letter-spacing: 1px;
}

.warning {
    color: #ff6969;
    font-size: 22px;
    font-weight: bold;
    margin-top: 8px;
}

.description {
    color: #d8d0c8;
    line-height: 1.55;
    margin-bottom: 24px;
}

/* GIF PÄÄOSASSA */

.main-gif {
    width: 100%;
    margin: 20px 0 35px;
    padding: 0;
    background: transparent;
}

.main-gif img {
    width: 100%;
    max-height: 520px;
    object-fit: contain;
    display: block;
    margin: 0;
    border: none;
}

/* NAPIT */

.actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;

    margin-top: 25px;
    margin-bottom: 24px;
}

button {
    background: #0b0b0b;
    color: #f1e7df;
    border: 1px solid #6b3a3a;
    padding: 14px 12px;
    font-size: 15px;
    font-family: "Courier New", monospace;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #151515;
    border-color: #a85151;
    transform: translateY(-1px);
}

.btn-green {
    color: #73d873;
    border-color: #355f35;
}

.btn-red {
    color: #ff7c7c;
    border-color: #6e3333;
}

.btn-yellow {
    color: #e0b65a;
    border-color: #6d582e;
}

/* OHJELAATIKKO */

#instruction {
    margin-top: 30px;
    min-height: 70px;
    padding: 0;
    color: #eeeeee;
    font-family: "Trebuchet MS", Arial, sans-serif;
    font-size: 19px;
    font-style: normal;
    font-weight: 400;

    line-height: 1.6;
    letter-spacing: 0.2px;
    text-align: center;
    border: none;
    background: transparent;
}

.counter {
    color: #8f8f8f;
    margin-top: 12px;
    font-size: 14px;
}

/* VIESTILAATIKKO */

.message-box {
    margin-top: 30px;
    padding-top: 24px;
    border-top: 1px solid #3c2626;
}

.message-box h2 {
    color: #d97676;
    font-size: 17px;
    font-weight: normal;
    letter-spacing: 1px;
}

.message-box textarea {
    width: 100%;
    min-height: 110px;
    background: #050505;
    color: #e8dfd7;
    border: 1px solid #5f3030;
    padding: 14px;
    font-family: "Courier New", monospace;
    font-size: 16px;
    resize: vertical;
    outline: none;
}

.message-box textarea:focus {
    border-color: #a54f4f;
}
    #charCount {
    margin-top: 6px;
    text-align: right;
    color: #666666;
    font-size: 11px;
    font-family: "Courier New", monospace;
}

.message-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-top: 10px;
}

#messageStatus {
    color: #70c970;
    font-size: 13px;
    margin: 0;
    text-align: left;
}

/* LOGIN */

#loginScreen {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;
    height: 100vh;
    height: 100dvh;

    background: #050505;
    color: #ff3333;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    z-index: 99999;
    font-family: "Courier New", monospace;

    padding: 30px;
    overflow: hidden;
}

#loginScreen h1 {
    color: red;
    text-shadow: 0 0 15px rgba(255, 0, 0, 0.35);
}

#loginScreen input {
    background: black;
    color: #00ff00;
    border: 1px solid #7d3030;
    padding: 12px;
    font-size: 15px;
    text-align: center;
}
#loginForm {
    display: flex;
    flex-direction: column;
    align-items: center;
}
    #loginScreen button {
    margin-top: 13px;
}

#loginError {
    color: orange;
    margin-top: 15px;
}


/* Piilota varsinainen sivu ennen kirjautumista */
body.locked {
    overflow: hidden;
}

body.locked .container {
    display: none;
}

/* GIF overlayt */

#emergencyGif,
#randomGifOverlay {
    display: none;
    position: fixed;
    z-index: 999999;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: black;
    justify-content: center;
    align-items: center;
}

#emergencyGif img,
#randomGifImage {
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    margin: 0;
    border: none;
    object-fit: contain;
}

/* MOBIILI */

@media (max-width: 700px) {

    body {
        padding: 10px;
    }

    .container {
        padding: 20px;
        border: none;
        box-shadow: none;
    }

    .actions {
        grid-template-columns: 1fr;
    }

    .message-actions {
        flex-direction: row;
    align-items: center;
    justify-content: space-between;
}

.message-actions button {
    width: auto;
    padding: 9px 14px;
    font-size: 13px;
    flex-shrink: 0;
}

#messageStatus {
    flex: 1;
    font-size: 12px;
}
}
</style>

</head>

<body class="locked">

<div id="loginScreen">

    <h1>⚠ DANGER ZONE ⚠</h1>

    <p>
        Tämä linkki antoi sinulle viruksen. 
    </p>
    
     <p>
        Sankari tietää nykyisen koodin.
    </p>

    <p>
        Anna käyttöoikeuskoodi.
    </p>
<form id="loginForm" onsubmit="event.preventDefault(); checkPassword();">

    <input
        type="password"
        id="passwordInput"
        placeholder="Access Code">

    <button type="submit">
        AUTHORIZE
    </button>

    <p id="loginError"></p>

</form>

</div>

<div class="container">

<h1>SURVIVAL GUIDE FOR NKR</h1>

<p class="description">
</p>

<div class="main-gif">
    <img src="giphy.gif" alt="Angry Hamster">
</div>

<div class="actions">

    <button class="btn-green" onclick="giveInstruction()">
        ANNA OHJE
    </button>

    <button class="btn-red" onclick="activateEmergency()">
        AKTIVOI HALAUS
    </button>

    <button class="btn-yellow" onclick="thirdAction()">

</div>

Paina nappia vastaanottaaksesi ohje
</div>

<div class="counter">
Vastaanotettuja ohjeita: <span id="count">0</span>
</div>

<div class="message-box">

    <h2>LÄHETÄ VASTALAUSE</h2>

    <textarea
        id="messageInput"
        placeholder="Kirjoita viesti..."
        maxlength="1000"></textarea>

   <div id="charCount">0 / 1000</div>

    <div class="message-actions">

        <p id="messageStatus">TERMINAL READY</p>

        <button class="btn-red" onclick="sendMessage()">
            LÄHETÄ
        </button>

    </div>

</div>

</div>
<img id="surpriseGif"
     src=""
     alt="Yllätys-GIF"
     style="display:none; max-width:100%; margin-top:20px;">


<!-- Piilotettu yllätys-GIF -->

<div id="emergencyGif">
    <img src="marcus-the-worm-robert-help.gif" alt="Halaus-GIF">
</div>

<div id="randomGifOverlay">
    <img id="randomGifImage" alt="">
</div>


<script>

const instructions = [
"Kaikki valitukset ja toiveet voi toimittaa. Niitä ei käsitellä.",
"Älä kysy Hamsterilta miksi. Hamsteri tietää miksi.",
"Olet hyvä. Historiassa.",
"Hereford Mappa Mundi -kartassa itä on ylhäällä, eli yhtä typerä systeemi kuin Turussa."
    
    
];

const surpriseGifs = [
    "giphy-shy.gif",
    "giphy-stupid.gif"
];

let count = 0;

function giveInstruction() {
    const instructionBox = document.getElementById("instruction");
    const overlay = document.getElementById("randomGifOverlay");
    const image = document.getElementById("randomGifImage");

    // 5 % mahdollisuus näyttää yllätys-GIF.
    if (Math.random() < 0.02) {
        const randomGif =
            surpriseGifs[Math.floor(Math.random() * surpriseGifs.length)];

        // Tyhjentäminen käynnistää GIF-animaation uudelleen.
        image.src = "";
        image.src = randomGif;

        overlay.style.display = "flex";
        instructionBox.textContent = "ERIKOISTAPAHTUMA HAVAITTU";

        setTimeout(function () {
            overlay.style.display = "none";
            image.src = "";
        }, 1700);
    } else {
        const random =
            Math.floor(Math.random() * instructions.length);

        instructionBox.textContent = instructions[random];
    }

    count++;
    document.getElementById("count").textContent = count;
}

function activateEmergency() {

    const overlay = document.getElementById("emergencyGif");
    const image = overlay.querySelector("img");

    image.src = "";

    setTimeout(function () {

        image.src = "marcus-the-worm-robert-help.gif?restart=" + Date.now();
        overlay.style.display = "flex";

        setTimeout(function () {
            overlay.style.display = "none";
            image.src = "";
        }, 1900);

    }, 20);
}
    function checkPassword() {

    const correctPassword = "jummijammi";

    const enteredPassword =
        document.getElementById("passwordInput").value;

    if (enteredPassword === correctPassword) {

    document.getElementById("loginScreen").style.display = "none";
    document.body.classList.remove("locked");

} else {

        document.getElementById("loginError").textContent =
            "ACCESS DENIED";

    }
}


document.addEventListener("DOMContentLoaded", function () {

    document
        .getElementById("passwordInput")
        .addEventListener("keypress", function (event) {

            if (event.key === "Enter") {
                checkPassword();
            }

        });
const messageInput = document.getElementById("messageInput");
const charCount = document.getElementById("charCount");

messageInput.addEventListener("input", function () {
    charCount.textContent =
        messageInput.value.length + " / 1000";
    });
});

</script>

    const supabaseClient = supabase.createClient(

    );

    async function recordPageView() {

            .from("page_views")
            .insert({});

        if (error) {
            console.error("Page view error:", error);
        }
    }

    recordPageView();

    async function sendMessage() {

    const input = document.getElementById("messageInput");
    const status = document.getElementById("messageStatus");
    const charCount = document.getElementById("charCount");

    const message = input.value.trim();

    if (!message) {
        status.textContent = "Kirjoita ensin viesti.";
        return;
    }

    const { error } = await supabaseClient
        .from("messages")
        .insert({
            message: message
        });

    if (error) {
        console.error("Message error:", error);
        status.textContent = "Viestin lähetys epäonnistui.";
        return;
    }

    input.value = "";
    document.getElementById("charCount").textContent = "0 / 1000";
    status.textContent = "VIESTI VÄLITETTY ✓";
}
</script>

</body>
</html>
